name: Reporte Diario de Observaciones COVEPA

on:
  schedule:
    # Se ejecuta cada 5 minutos en la tarde/noche (hora Perú: 4:00 PM a 11:55 PM / UTC 21:00 a 04:55)
    # y el script comprueba automáticamente si coincide con la hora programada (ej. 18:24, 21:00)
    - cron: '*/5 21,22,23,0,1,2,3,4 * * *'
  workflow_dispatch:
    inputs:
      manual_run:
        description: 'Forzar envío inmediato ignorando la hora'
        required: false
        default: 'true'

jobs:
  enviar-reporte:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias de correo
        run: npm install nodemailer @supabase/supabase-js --no-save

      - name: Compilar y enviar reporte diario
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL || 'https://byywikicdvmmmndhkooe.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5eXdpa2ljZHZtbW1uZGhrb29lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTIxODgsImV4cCI6MjEwODA4ODE4OH0.KnBrlx7KmH6OelDv9k7EstHhuFCTGcgtgarLvHh4epk' }}
          SMTP_HOST: 'mail.covepa.pe'
          SMTP_PORT: '465'
          SMTP_USER: ${{ secrets.SMTP_USER || 'ccondor@covepa.pe' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IS_MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: node scripts/enviar_reporte_diario.cjs

