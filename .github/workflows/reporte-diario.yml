name: Reporte Diario de Observaciones COVEPA

on:
  schedule:
    # Horarios de comprobación automática desatendida (Hora Perú UTC-5):
    # - 1:00 PM (13:00 Perú = 18:00 UTC)
    # - 7:00 PM (19:00 Perú = 00:00 UTC)
    # - 9:00 PM (21:00 Perú = 02:00 UTC)
    # - 10:00 PM (22:00 Perú = 03:00 UTC)
    - cron: '0 0,2,3,18 * * *'
    # - 9:30 PM (21:30 Perú = 02:30 UTC)
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Forzar reenvío ignorando si ya se envió hoy'
        required: false
        default: 'false'
      destinatario_prueba:
        description: 'Correo de destino para la prueba (opcional)'
        required: false
        default: ''
      tipo_reporte:
        description: 'Tipo de reporte (diario o diario_interno)'
        required: false
        default: 'diario'

jobs:
  enviar-reporte:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias de correo
        run: npm install nodemailer @supabase/supabase-js exceljs --no-save

      - name: Compilar y enviar reporte diario
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: 'mail.covepa.pe'
          SMTP_PORT: '465'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IS_MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          FORZAR_ENVIO: ${{ github.event.inputs.forzar == 'true' }}
          DESTINATARIO_PRUEBA: ${{ github.event.inputs.destinatario_prueba }}
          TIPO_REPORTE: ${{ github.event.inputs.tipo_reporte || 'diario' }}
        run: node scripts/enviar_reporte_diario.cjs
