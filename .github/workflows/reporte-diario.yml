name: Reporte Diario de Observaciones COVEPA

on:
  schedule:
    # Se ejecuta cada 10 minutos de forma desatendida las 24 horas del día.
    # El script en Node.js consulta Supabase y solo despacha cuando ya se alcanzó la hora programada en hora Perú.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Forzar reenvío ignorando si ya se envió hoy'
        required: false
        default: 'false'

jobs:
  enviar-reporte:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias de correo
        run: npm install nodemailer @supabase/supabase-js exceljs --no-save

      - name: Compilar y enviar reporte diario
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: 'mail.covepa.pe'
          SMTP_PORT: '465'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IS_MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          FORZAR_ENVIO: ${{ github.event.inputs.forzar == 'true' }}
        run: node scripts/enviar_reporte_diario.cjs
